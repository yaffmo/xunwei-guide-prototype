<head>

<title>看見台灣・尋味指南｜網站原型（審閱版）</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:#222;background:#d0d3d8}
button{font:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #1a55d6;outline-offset:2px}
#app{display:flex;height:100vh;overflow:hidden}

/* 控制台 */
.panel{width:360px;flex-shrink:0;height:100vh;overflow-y:auto;background:#1f2328;color:#e8eaed;padding:24px 20px;display:flex;flex-direction:column;gap:20px}
.panel.hide{display:none}
.ptitle{font-size:19px;font-weight:700}
.psub{font-size:13px;color:#aab1bb;margin-top:4px;line-height:1.6}
.pinfo{background:#2c3137;border-radius:8px;padding:12px 14px;font-size:13px;line-height:1.7}
.pinfo b{color:#fff}
.plabel{font-size:13px;color:#c9ced5;font-weight:700;margin-bottom:8px}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pbtn{display:block;width:100%;text-align:left;border:1px solid #3a4048;border-radius:8px;padding:9px 12px;font-size:13px;line-height:1.5;cursor:pointer;background:#2c3137;color:#e8eaed}
.pbtn.on{background:#e8eaed;color:#1f2328;border-color:#e8eaed}
.pgroup{font-size:13px;font-weight:700;color:#d6dbe1;margin:6px 0 2px}
.code{display:inline-block;min-width:34px;font-weight:700;color:#f0b35a}
.pbtn.on .code{color:#8a4b00}
.pfb{background:#f5c542;color:#1f2328;border:0;border-radius:8px;padding:12px;font-weight:700;font-size:14px;cursor:pointer}
.pnote{font-size:12px;line-height:1.7;color:#aab1bb}

/* 主區 */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:52px;flex-shrink:0;display:flex;align-items:center;gap:8px;padding:0 16px;background:#e2e4e8;border-bottom:1px solid #c5c8cd}
.tab{border:0;background:none;padding:8px 14px;border-radius:6px;font-size:14px;cursor:pointer;color:#333}
.tab.on{background:#fff;font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.topbar .sp{flex:1}
.tbtn{border:1px solid #999;background:#fff;border-radius:6px;padding:7px 12px;font-size:13px;cursor:pointer}
.fbtab{border:0;background:#f5c542;color:#1f2328;border-radius:6px;padding:8px 14px;font-size:14px;font-weight:700;cursor:pointer}
.stage{flex:1;min-height:0;padding:16px}
.browser{position:relative;height:100%;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.15);display:flex;flex-direction:column}
.urlbar{height:34px;flex-shrink:0;background:#e9eaec;border-bottom:1px solid #cfd2d6;display:flex;align-items:center;gap:8px;padding:0 14px;font-size:13px;color:#444}
.urlbar i{width:10px;height:10px;border-radius:50%;background:#c4c7cc;display:inline-block}
.urlbar span{margin-left:10px;background:#fff;border-radius:6px;padding:3px 12px;min-width:360px}
.scroll{flex:1;overflow-y:auto;position:relative}

/* 網站元件 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 28px;border-radius:999px;background:#333;color:#fff;border:1px solid #333;font-size:15px;font-weight:600;cursor:pointer}
.btn:hover{background:#111}
.btn2{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 28px;border-radius:999px;background:#fff;color:#333;border:1px solid #333;font-size:15px;font-weight:600;cursor:pointer}
.btn2.on{background:#333;color:#fff}
.btnS{min-height:40px;padding:0 18px;font-size:14px}
.linkb{background:none;border:0;padding:0;color:#1a55d6;text-decoration:underline;cursor:pointer}
.navb{background:none;border:0;font-size:15px;color:#333;padding:8px 2px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:44px}
.navb.on{font-weight:700;box-shadow:inset 0 -2px 0 #333}
.inp{display:block;width:100%;height:44px;border:1px solid #b5b5b5;border-radius:6px;padding:0 12px;font:inherit;font-size:15px;background:#fff;color:#222}
.inp.err{border:2px solid #c62828}
.auto{background:#ececec;color:#555;display:flex;align-items:center}
textarea.inp{height:96px;padding:12px}
.lbl{display:block;font-size:14px;font-weight:600;margin:0 0 6px}
.req{color:#c62828}
.errt{color:#c62828;font-size:13px;margin-top:6px}
.errbox{background:#fdecea;border:1px solid #e8a39e;color:#8e1c1c;border-radius:8px;padding:14px 16px;font-size:14px;line-height:1.6}
.infobox{background:#e8f1fd;border:1px solid #a9c6f0;color:#173d7a;border-radius:8px;padding:14px 16px;font-size:14px;line-height:1.6}
.anno{color:#08705e;font-size:13px;font-weight:600;line-height:1.6}
.phead{background:#f0f0f0;padding:44px 40px;text-align:center}
.phead h1{margin:0;font-size:34px;color:#333}
.phead p{margin:12px 0 0;font-size:17px;color:#444}
.sec{max-width:1080px;margin:0 auto;padding:48px 40px}
.narrow{max-width:580px}
.mid{max-width:860px}
.card{background:#f0f0f0;border-radius:12px;padding:32px}
.stack{display:flex;flex-direction:column;gap:16px}
.ph.vid{aspect-ratio:16/9;font-size:15px;line-height:1.7}
.ph{background:#d9d9d9;display:flex;align-items:center;justify-content:center;color:#444;font-size:14px;border-radius:8px;text-align:center;padding:8px}
.tag{display:inline-flex;align-self:flex-start;padding:3px 12px;border-radius:999px;font-size:13px;font-weight:600;background:#333;color:#fff}
.chip{display:inline-flex;align-items:center;padding:6px 14px;border-radius:999px;background:#fff;border:1px solid #ccc;font-size:14px;font-weight:600}
.h2{font-size:24px;font-weight:700;margin:0 0 16px;color:#1c2a4a}
.rules{background:#f0f0f0;padding:28px 36px;font-size:15px;line-height:1.8;border-radius:12px}
.rules b{display:block;margin-top:14px}
.rules b:first-child{margin-top:0}
.lsub{margin-top:6px;padding-left:16px;border-left:3px solid #d0d0d0}
.lsub b{font-weight:600;margin-top:8px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:46px;border:1px solid #c7c7c7;border-radius:6px;background:#fff;font-size:15px;cursor:pointer}
.divider{display:flex;align-items:center;gap:12px;color:#555;font-size:13px;margin:6px 0}
.divider:before,.divider:after{content:"";flex:1;border-top:1px dashed #999}
.chk{display:flex;align-items:center;gap:8px;font-size:15px;line-height:1.6}
.chk input{width:18px;height:18px;margin:0;flex-shrink:0}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 24px}
.fg{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;align-items:center;padding:14px 16px;background:#e6e6e6;font-size:14px}
.row4{grid-template-columns:repeat(4,minmax(0,1fr))}
.th{background:#cfcfcf;font-weight:700}
.sp2{grid-column:span 2}
.pill{padding:3px 10px;border-radius:999px;font-weight:600;background:#fff;color:#333}
.pill.ok{background:#d9f0e8;color:#0a5e4f}
.pill.no{background:#fde2e1;color:#8e1c1c}
.hero{background:#f0f0f0;padding:56px 40px}
.wrap{max-width:1080px;margin:0 auto}
.heroRow{display:flex;justify-content:space-between;align-items:flex-end;gap:48px;margin-top:16px}
.ht{margin:0;font-size:44px;font-weight:700;color:#333}
.hs{margin:16px 0 0;font-size:22px;font-weight:600;color:#333}
.hb{margin:16px 0 0;font-size:15px;line-height:1.7;max-width:620px}
.hp{margin:20px 0 0;font-size:15px;font-weight:700}
.banner{background:#fff6d6;border-bottom:1px solid #e6cf7a;padding:14px 40px}
.banner .wrap{display:flex;align-items:center;justify-content:space-between;gap:24px;font-size:15px;font-weight:600}
.steps{display:flex;justify-content:center;gap:48px}
.step{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;font-size:15px;width:220px}
.dot{width:88px;height:88px;border-radius:50%;background:#d9d9d9;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:#333}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.g5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}
.g6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.dark{background:#333!important;color:#fff}
.header{height:72px;display:flex;align-items:center;padding:0 40px;gap:36px;border-bottom:1px solid #e5e5e5;background:#fff;position:sticky;top:0;z-index:10}
.header nav{display:flex;gap:26px;flex:1}
.menu{position:absolute;right:0;top:48px;width:180px;background:#fff;border:1px solid #ddd;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.12);display:flex;flex-direction:column;padding:6px}
.menu .navb{justify-content:flex-start;padding:8px 12px}
.foot{background:#fff;border-top:1px solid #e5e5e5;padding:32px 40px;font-size:13px;line-height:1.7;color:#333}
.foot .wrap{display:flex;justify-content:space-between;gap:40px}
.floats{position:absolute;right:28px;bottom:28px;display:flex;flex-direction:column;gap:14px;z-index:12}
.fl{width:88px;height:88px;border-radius:50%;border:0;background:#d9d9d9;font-size:17px;font-weight:600;cursor:pointer;line-height:1.3}
.scard{background:#fff;border:1px solid #ddd;border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.scard .b{padding:16px;display:flex;flex-direction:column;gap:8px}
.ov{position:absolute;inset:34px 0 0 0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:30}
.modal{background:#fff;border-radius:14px;width:540px;max-width:92%;max-height:90%;overflow:auto;padding:32px;display:flex;flex-direction:column;gap:16px}
.modal h3{margin:0;font-size:22px}
.mrow{display:flex;gap:12px;justify-content:flex-end}
.icon{width:80px;height:80px;border-radius:50%;background:#e6e6e6;display:flex;align-items:center;justify-content:center}

/* User Flow / 例外總表 */
.doc{padding:40px 48px;max-width:1500px}
.doc h1{margin:0;font-size:30px}
.doc .lead{font-size:15px;color:#444;margin:8px 0 24px}
.lane{display:flex;gap:20px;margin-bottom:16px}
.lh{width:190px;flex-shrink:0;background:#333;color:#fff;border-radius:10px;padding:16px;font-size:14px;line-height:1.6}
.lh b{font-size:17px;display:block}
.lb{flex:1;display:flex;flex-direction:column;gap:10px;background:#f5f5f5;border-radius:10px;padding:16px 18px}
.path{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.st{background:#fff;border:1px solid #bdbdbd;border-radius:8px;padding:7px 11px;font-size:14px;line-height:1.4}
.dc{background:#fff;border:1.5px dashed #555;border-radius:8px;padding:7px 11px;font-size:14px}
.ar{color:#666}
.ex{display:inline-block;background:#8e1c1c;color:#fff;border-radius:4px;padding:1px 6px;font-size:12px;font-weight:700;margin-left:4px;border:0;cursor:pointer}
.br{font-size:14px;line-height:1.7;color:#333}
.tr{display:grid;grid-template-columns:70px 200px 260px minmax(0,1fr) 200px 96px;border-bottom:1px solid #d6d6d6}
.tr>span,.tr>div{padding:11px 12px;font-size:14px;line-height:1.6}
.thd{background:#333;color:#fff;font-weight:700;border-radius:8px 8px 0 0}
.grp{background:#f0f0f0;font-weight:700;font-size:15px;padding:10px 12px;border-bottom:1px solid #d6d6d6}
.id{font-weight:700;color:#8e1c1c}

.narrowWarn{display:none;background:#fff6d6;padding:10px 16px;font-size:13px;border-bottom:1px solid #e6cf7a}
@media (max-width:1100px){.panel{position:fixed;z-index:50;left:0;top:0;box-shadow:4px 0 20px rgba(0,0,0,.3)}.narrowWarn{display:block}}
/* 手機版 */
.mstage{display:flex;justify-content:center}
.browser.phone{width:390px;max-width:100%;border-radius:28px;border:8px solid #1f2328}
.phone .urlbar span{min-width:0;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;margin-left:4px}
.phone .urlbar i{display:none}
.mhead{height:60px;padding:0 8px 0 16px;gap:8px}
.mnav{position:absolute;left:0;right:0;top:60px;background:#fff;border-bottom:1px solid #ddd;box-shadow:0 8px 16px rgba(0,0,0,.1);display:flex;flex-direction:column;padding:8px 16px 12px}
.header .mnav{gap:0;flex:none}
.mnav .navb{justify-content:flex-start;font-size:16px}
.mnav .navb.on{box-shadow:none;text-decoration:underline}
.mnav hr{border:0;border-top:1px solid #e5e5e5;margin:6px 0;width:100%}
.phone .sec{padding:28px 16px}
.phone .hero{padding:28px 16px}
.phone .heroRow{flex-direction:column;align-items:stretch;gap:20px}
.phone .ht{font-size:28px}
.phone .hs{font-size:18px}
.phone .phead{padding:28px 16px!important}
.phone .phead h1{font-size:24px}
.phone .phead p{font-size:15px}
.phone .banner{padding:12px 16px}
.phone .banner .wrap{flex-direction:column;align-items:flex-start;gap:10px}
.phone .g3,.phone .g4,.phone .fgrid{grid-template-columns:minmax(0,1fr)}
.phone .storeGrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.phone .g6{grid-template-columns:repeat(2,minmax(0,1fr))}
.phone .steps{flex-direction:column;align-items:center;gap:28px}
.phone .dot{width:64px;height:64px;font-size:22px}
.phone .card{padding:20px}
.phone .rules{padding:20px 18px;font-size:14px}
.phone .row{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px}
.phone .row.th{display:none}
.phone .foot{padding:24px 16px}
.phone .foot .wrap{flex-direction:column;gap:16px}
.phone .floats{right:14px;bottom:14px;gap:10px}
.phone .fl{width:64px;height:64px;font-size:14px}
.phone .modal{padding:22px 18px;max-width:94%}
.phone .mrow{flex-wrap:wrap}
.phone .mrow>*{flex:1}
.phone .h2{font-size:20px}
.phone .scroll [style*="justify-content:space-between"]{flex-direction:column;align-items:stretch!important;gap:12px!important}
.phone .scroll [style*="gap:40px"],.phone .scroll [style*="display:flex;border-radius:12px"]{flex-direction:column;gap:20px!important}
.phone .scroll [style*="gap:40px"]{padding:16px!important}
.phone .scroll [style*="width:420px"],.phone .scroll [style*="width:60%"]{width:100%!important;height:220px!important}
.phone .scroll [style*="min-width:2"]{min-width:0!important;width:100%}
.phone .scroll [style*="grid-template-columns:repeat(2"]{grid-template-columns:minmax(0,1fr)!important}
.phone .scroll [style*="padding:48px"],.phone .scroll [style*="padding:56px"],.phone .scroll [style*="padding:40px"]{padding:24px 18px!important}
.phone .scroll [style*="padding:28px 40px"],.phone .scroll [style*="padding:24px 40px"],.phone .scroll [style*="padding:28px 32px"]{padding:20px 16px!important}
.phone .scroll [style*="font-size:34px"]{font-size:24px!important}
.phone .scroll [style*="font-size:30px"]{font-size:22px!important}
.phone .scroll [style*="font-size:28px"]{font-size:22px!important}
.phone .scroll input[style*="width:210px"],.phone .scroll select[style*="width:150px"]{width:100%!important;margin-left:0!important}
.phone .scroll [style*="margin-left:auto"]{margin-left:0!important;width:100%}
.phone .scroll [style*="width:300px"]{width:100%!important}
@media (max-width:600px){.mstage{padding:0}.browser.phone{width:100%;border:0;border-radius:0}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

function header() {
  const NAV = {
    pre: [['活動首頁', 'home'], ['活動辦法', 'rules']],

  const grp = { nomRules: 'nom', nomForm: 'nom', nomSuccess: 'nom', voteRules: 'vote', storeList: 'vote', storeDetail: 'vote' }[S.screen] || S.screen;

  const acct = S.loggedIn

    const acctM = S.loggedIn ? b(USER + '活動紀錄', 'go', 'records', 'navb') + b('登出', 'logout', '', 'navb') : b(USER + '註冊／登入', 'go', 'login', 'navb');

  }
  return `<header class="header">${b('[看見台灣基金會 Logo]', 'go', 'home', 'navb', 'style="font-weight:700;font-size:16px"')}<nav aria-label="主選單">${items}</nav>${acct}<div style="font-size:14px;font-weight:600">繁中｜EN｜JP</div></header>`;

const RULES_HTML = `<div class="rules"><b style="font-size:18px">辦法及規則</b>財團法人看見台灣基金會（以下簡稱「主辦單位」）徵求「看見台灣 尋味指南」地方特色店家。無論您是台灣民眾或在台外籍人士，都歡迎推薦心中最道地的台灣好味道，讓世界看見台灣。<div style="margin-top:8px;font-size:14px;color:#555">※ 所有時間以本活動網站伺服器時間為準。主辦單位保留時程變更之權利，變更內容將公告於活動網站。</div><b>一、會員註冊與參加資格</b><div class="lsub"><b>1. 參加資格</b><ul style="margin:4px 0 0;padding-left:22px"><li>凡中華民國國民及持有效居留證之外籍人士，均可參加提名與投票。</li><li>未滿 18 歲者，須事先取得法定代理人同意；如獲獎，須檢附法定代理人同意書方得領獎。</li><li>主辦單位、承辦單位之員工及本活動相關工作人員，不得參加。</li></ul><b>2. 會員註冊</b><ul style="margin:4px 0 0;padding-left:22px"><li>參加提名或投票前，須先註冊並登入活動網站會員。</li><li>註冊方式：Email 註冊須完成 Email 驗證；以 Google 帳號登入者，首次登入須補填聯絡電話。</li><li>註冊時須勾選同意服務條款及隱私權政策，並確認已年滿 18 歲或已取得法定代理人同意。</li><li>會員須據實填寫姓名、Email 及聯絡電話。如因資料不實或不完整，影響參加或領獎權益，由會員自行負責。</li><li>每人限以一個會員帳號參加。</li></ul></div><b>二、第一階段：全民提名</b><div class="lsub"><b>1. 提名期間</b>2026/11/16 00:00 至 12/20 23:59 止。截止後送出之提名一律不予受理。<b>2. 提名規範</b><ul style="margin:4px 0 0;padding-left:22px"><li>每個會員帳號最多可提名 10 家店家，可分散於不同品項，也可集中於同一品項。</li><li>同一帳號不得重複提名同一家店家，以店名及地址判定。重複提名不予受理，也不計入提名數及抽獎機會。</li><li>被提名之店家，須設址於台灣本島或離島（含澎湖、金門、馬祖）。</li><li>歡迎店家自我推薦，惟同樣須經資格審查。</li></ul><b>3. 提名表單填寫項目</b><ol style="margin:4px 0 0;padding-left:22px"><li>提名人資料：姓名、Email 由會員資料自動帶入；聯絡電話為必填。</li><li>推薦品項：牛肉麵（正餐）、豆花（甜點）、鳳梨酥（伴手禮），擇一。</li><li>店家資料：店家名稱、店家電話、所在縣市、店家地址，皆為必填。</li><li>推薦理由：可複選，至少勾選一項。選項包括【經典口味】美味道地、獨門口感；【嚴選食材】真材實料、品質堅持；【職人傳承】老字號／在地特色故事；【海外友善】環境整潔、對外籍旅客親切；【造訪體驗】交通方便、內用或購買體驗佳；【創新風味】創意吃法、口味推陳出新；【其他】自行輸入。</li><li>勾選同意服務條款、隱私權政策及資料授權條款。</li></ol><b>4. 修改提名</b><ul style="margin:4px 0 0;padding-left:22px"><li>提名送出後不得修改。如需更正，請於提名期間內至「活動紀錄」頁刪除該筆提名後重新提名。</li><li>提名截止後，提名內容即鎖定，不得修改。</li></ul><b>5. 提名注意事項</b><ul style="margin:4px 0 0;padding-left:22px"><li>店家名稱或地址有誤、無法辨識之提名，主辦單位得予以刪除。</li><li>提名內容不得含有侵害他人權利、違反公序良俗、惡意誹謗或商業廣告之內容。違者，主辦單位得刪除該筆提名；如致主辦單位或第三人受有損害，由提名者自負法律責任。</li></ul></div><b>三、店家資格審查（四大門檻）</b>為維護活動之客觀性、公信力與國際接待可行性，所有被提名店家須經主辦單位依下列四大門檻進行資格審查。<ol style="margin:4px 0 0;padding-left:22px"><li><b style="display:inline">門檻一【合規場域】</b>：具備台灣合法登記營業之實體場所，或可直接接待體驗之場域。</li><li><b style="display:inline">門檻二【資料完整】</b>：店家基本資料正確完整，並通過主辦單位之電話或 Email 驗證。</li><li><b style="display:inline">門檻三【營運穩定】</b>：營業年資滿 1 年（含）以上。</li><li><b style="display:inline">門檻四【品質與商譽】</b>：近 1 年內無重大食品安全事件、消費糾紛或重大負面聲譽紀錄。</li></ol><ul style="margin:4px 0 0;padding-left:22px"><li>通過資格審查，並完成簽署授權同意書之店家，將全數進入第二階段全民投票。</li><li>提名者可於「活動紀錄」頁查看所提名店家之審查結果。</li></ul><div style="margin-top:6px;font-size:14px;color:#555">※ 本資格審查僅確認店家具備基本合規與接待能力，不代表主辦單位對店家商品品質、服務內容或商業表現之評鑑或背書。</div><b>四、第二階段：全民投票</b><div class="lsub"><b>1. 投票期間</b>2027/01/04 00:00 至 01/29 23:59 止。截止後送出之投票一律不予受理。<b>2. 投票規範</b><ul style="margin:4px 0 0;padding-left:22px"><li>瀏覽投票店家無須登入；投票時須登入會員。</li><li>每個會員帳號於投票期間，牛肉麵、豆花、鳳梨酥三大品項各有 3 票，每人最多共 9 票。</li><li>同一家店家，每個帳號限投 1 票。</li><li>投票送出後，不得修改或取消。</li></ul><b>3. 定榜機制</b><ul style="margin:4px 0 0;padding-left:22px"><li>三大品項各依有效票數取前 10 名，共選出 30 家年度精選特色店家。</li><li>嚴禁以多重帳號、外掛程式、自動化程式或其他不正當方式投票。經主辦單位認定屬實者，將刪除該不正常票數，並取消相關帳號之抽獎資格。</li><li>最終結果以刪除不正常票數後之有效票數為準。</li><li>本活動對外不公布具體得票數，亦不進行名次排序。30 家得獎名單依品項分組，組內依「行政縣市順序＋店名筆畫」排列公告。</li></ul></div><b>五、第三階段：精選店家揭曉與頒獎典禮</b><ul style="margin:4px 0 0;padding-left:22px"><li><b style="display:inline">精選店家揭曉</b>：2027/02/25 公布 30 家年度精選特色店家名單，並收錄於活動網站。</li><li><b style="display:inline">頒獎典禮</b>：2027/03/10 舉辦頒獎典禮暨交流茶會，邀請 30 家得獎店家代表出席，每家最多 2 位。</li><li><b style="display:inline">後續運用</b>：得獎店家資訊將長期收錄於主辦單位官網特色資料庫，並結合季節專題、海外觀光推廣與國際媒體報導，持續向全球旅客推廣。</li></ul><b>六、店家權益、誠信公約與退賽機制</b><div class="lsub"><b>1. 禁止不正當拉票</b>參選店家得自行向顧客宣傳拉票，但不得以發放現金、贈送免費餐點或商品，或提供其他對價利益等方式換取票數。經查證屬實者，主辦單位得取消該店家之參選及得獎資格。<b>2. 退賽與資格撤銷</b><ul style="margin:4px 0 0;padding-left:22px"><li><b style="display:inline">主動退賽</b>：參選或得獎店家如欲退出，須於指定期限內向主辦單位提出書面申請。退賽後，主辦單位將下架該店家頁面，並依有效票數順序遞補。</li><li><b style="display:inline">撤銷資格</b>：參選或得獎店家於活動期間或公布後，如發生產權糾紛、歇業或營業中斷、重大食品安全違規、嚴重消費糾紛或違反公序良俗等情事，主辦單位得撤銷其資格、下架相關頁面，並收回榮譽獎狀。</li></ul><b>3. 標章與宣傳使用</b>得獎店家僅得於主辦單位授權範圍內，使用獎狀及官方指定標章進行榮譽展示。不得擅自改作主辦單位商標，亦不得宣稱主辦單位為其產品品質、食品安全或營運背書。</div><b>七、系統故障、不可抗力與最終解釋權</b><ul style="margin:4px 0 0;padding-left:22px"><li>如因天災、駭客攻擊、電信線路異常、伺服器過載或其他不可抗力之技術故障，導致提名或投票中斷、延遲或資料遺失，主辦單位得調整活動期間、暫停投票，或依既有有效資料定榜，參加者不得據此請求賠償。</li><li>主辦單位保留修正、變更、暫停或終止本活動內容、獎項及規則之權利。如有未盡事宜，將補充公告於活動網站，不另行個別通知。</li></ul></div><div class="rules"><b style="font-size:18px">三大品項</b>首屆活動聚焦「一餐、一甜、一禮」三大飲食消費場景，選出最具代表性與國際聲量的品項。<b>正餐代表｜牛肉麵</b>台灣最具代表性的國民美食之一。從濃郁的紅燒到清甜的清燉，一碗麵裡有職人的功夫，也有台灣人的日常。<ul style="margin:4px 0 0;padding-left:22px"><li>臺北市旅客「最推薦美食」第 1 名（58.65%），並獲觀光署官網重點介紹。</li><li>國際上名列 CNN 台灣 40 大美食第 2 名，並獲米其林指南專文推薦。</li></ul><b>甜點代表｜豆花</b>傳承手工凝固工藝的經典甜品，質地滑嫩綿密，搭配黑糖水與花生、芋圓、紅豆等在地配料。冬天暖胃、夏天消暑，是台灣人從小吃到大的甜滋味。<ul style="margin:4px 0 0;padding-left:22px"><li>獲觀光署官網「小吃飲品」重點推薦。</li><li>海外媒體包含 CNN，將其列為「19 道必吃台灣美食」之一。</li></ul><b>伴手禮代表｜鳳梨酥</b>結合台灣在地鳳梨與西式烘焙工藝，酥鬆的外皮包裹酸甜內餡，象徵「旺來」的好兆頭，是旅客離台前必買的代表伴手禮。<ul style="margin:4px 0 0;padding-left:22px"><li>來台旅客「最推薦伴手禮」第 1 名（75.10%），並獲觀光署官網重點推介。</li><li>重複入選 CNN 台灣 40 大美食必買伴手禮清單。</li></ul></div><div class="rules"><b style="font-size:18px">抽獎辦法</b>為感謝民眾參與，提名期與投票期分別獨立抽獎。<div class="lsub"><b>獎項</b><ul style="margin:4px 0 0;padding-left:22px"><li>大獎 1 名：現金 NT$10,000（提名期、投票期各 1 名）</li><li>小獎 80 名：電子票券 NT$500（提名期、投票期各 80 名）</li></ul><b>抽獎資格</b><ul style="margin:4px 0 0;padding-left:22px"><li>提名期：每成功提名 1 家店家，可獲得 1 次抽獎機會，單一帳號最多 5 次。抽獎機會於該店家通過資格審查後生效。</li><li>投票期：投票期間完成任一品項之投票，即可獲得 1 次抽獎機會，單一帳號限 1 次。</li></ul><b>中獎名單公布</b>提名期：［待確認］　投票期：［待確認］<b>1. 開獎方式</b>各期結束後，由律師見證並全程錄影進行抽獎。中獎名單以遮罩方式（姓名中間字及部分 Email）公布於活動網站「中獎名單」頁。<b>2. 領獎流程</b><ol style="margin:4px 0 0;padding-left:22px"><li>主辦單位於中獎名單公布後 4 日內，以 Email 寄送中獎及領獎通知。</li><li>中獎者須於收到通知後 7 日內，依信中說明回傳領獎文件。提名期回傳期限為［待確認］，投票期回傳期限為［待確認］。</li><li>領獎文件包括：身分證或護照影本；大獎得主須另提供匯款帳戶資料；未滿 18 歲者，須另附法定代理人同意書。</li><li>逾期未回傳或資料不全者，視同放棄中獎資格，由候補名單依序遞補。遞補者同樣須於接獲通知後 7 日內完成領獎手續。</li></ol><b>3. 獎項發放</b><ul style="margin:4px 0 0;padding-left:22px"><li>大獎以匯款方式發放。</li><li>小獎以 Email 寄送電子票券連結。</li></ul><b>4. 稅務規定</b><ul style="margin:4px 0 0;padding-left:22px"><li>中華民國境內居住之個人：中獎金額達 NT$20,000（含）以上者，由主辦單位依法代扣 10% 所得稅，並代扣 2.11% 二代健保補充保費；未達 NT$20,000 者，免預先扣繳，但須提供個人資料，主辦單位將寄發扣繳憑單，供申報年度綜合所得稅。</li><li>非中華民國境內居住之個人：依法按中獎金額扣繳 20% 所得稅。</li></ul><b>5. 其他</b><ul style="margin:4px 0 0;padding-left:22px"><li>同一期抽獎，每人限得一個獎項，以身分證字號或護照號碼為準。不同期可重複中獎。</li><li>經認定以不正當方式參加者，主辦單位得取消其中獎資格。</li><li>主辦單位保留獎項異動之權利。如因不可抗力無法提供原獎項，將以等值獎項替代。</li></ul></div></div><div class="rules"><b style="font-size:18px">抽獎條件 Q&amp;A</b><details style="border-top:1px solid #d8d8d8;padding:10px 0"><summary style="cursor:pointer;font-weight:600">怎麼獲得抽獎機會？</summary><div style="margin-top:6px">提名期每成功提名 1 家店家，可獲得 1 次抽獎機會，單一帳號最多 5 次；投票期完成任一品項之投票，即可獲得 1 次抽獎機會，單一帳號限 1 次。</div></details><details style="border-top:1px solid #d8d8d8;padding:10px 0"><summary style="cursor:pointer;font-weight:600">我提名的店家沒有通過審查，抽獎機會還算嗎？</summary><div style="margin-top:6px">不算。提名期的抽獎機會於該店家通過資格審查後才會生效。</div></details><details style="border-top:1px solid #d8d8d8;padding:10px 0"><summary style="cursor:pointer;font-weight:600">提名和投票都參加，可以中兩次獎嗎？</summary><div style="margin-top:6px">可以。提名期與投票期分別獨立抽獎，不同期可重複中獎；同一期每人限得一個獎項。</div></details><details style="border-top:1px solid #d8d8d8;padding:10px 0"><summary style="cursor:pointer;font-weight:600">中獎後要做什麼？</summary><div style="margin-top:6px">主辦單位會在中獎名單公布後 4 日內寄送 Email 通知。請於收到通知後 7 日內回傳身分證或護照影本；大獎得主另須提供匯款帳戶資料，未滿 18 歲者須附法定代理人同意書。逾期未回傳視同放棄。</div></details><details style="border-top:1px solid #d8d8d8;padding:10px 0"><summary style="cursor:pointer;font-weight:600">中獎需要扣稅嗎？</summary><div style="margin-top:6px">本活動單一獎項未達 NT$20,000，境內居住者免預先扣繳，但須提供個人資料，主辦單位將寄發扣繳憑單供申報綜合所得稅；非境內居住者依法扣繳 20% 所得稅。</div></details><div class="anno" style="margin-top:8px">原型說明：本段依「抽獎辦法」整理，需同步補進活動辦法文件</div></div><div class="rules"><b style="font-size:18px">常見問題</b><details style="border-top:1px solid #d8d8d8;padding:10px 0"><summary style="cursor:pointer;font-weight:600">誰可以參加？</summary><div style="margin-top:6px">凡中華民國國民及持有效居留證之外籍人士，皆可註冊會員參加。未滿 18 歲者，須事先取得法定代理人同意。</div></details><details style="border-top:1px solid #d8d8d8;padding:10px 0"><summary style="cursor:pointer;font-weight:600">提名或投票一定要註冊會員嗎？</summary><div style="margin-top:6px">是。可使用 Email 註冊，或以 Google 帳號直接登入。瀏覽投票店家不需登入，投票時才需要。</div></details><details style="border-top:1px solid #d8d8d8;padding:10px 0"><summary style="cursor:pointer;font-weight:600">每個帳號可以提名幾家店？</summary><div style="margin-top:6px">最多 10 家，可分散於不同品項，也可集中於同一品項。</div></details><details style="border-top:1px solid #d8d8d8;padding:10px 0"><summary style="cursor:pointer;font-weight:600">可以重複提名同一家店嗎？</summary><div style="margin-top:6px">同一帳號不能重複提名同一家店。不同民眾提名同一家店，系統會自動整合，提名次數不影響資格審查結果。</div></details><details style="border-top:1px solid #d8d8d8;padding:10px 0"><summary style="cursor:pointer;font-weight:600">店家可以自己提名自己嗎？</summary><div style="margin-top:6px">可以。歡迎店家自我推薦，同樣須經資格審查。</div></details><details style="border-top:1px solid #d8d8d8;padding:10px 0"><summary style="cursor:pointer;font-weight:600">提名送出後可以修改嗎？</summary><div style="margin-top:6px">提名送出後無法修改。如有錯誤，可於提名期間內至「活動紀錄」頁刪除後重新提名；提名截止後即無法刪除或修改。</div></details><details style="border-top:1px solid #d8d8d8;padding:10px 0"><summary style="cursor:pointer;font-weight:600">我提名的店家為什麼沒有出現在投票名單？</summary><div style="margin-top:6px">投票名單僅包含通過資格審查並完成授權之店家。審查結果可至「活動紀錄」頁查看。資料不完整、無法辨識，或未符合四大門檻之店家，將不列入投票名單。</div></details><details style="border-top:1px solid #d8d8d8;padding:10px 0"><summary style="cursor:pointer;font-weight:600">投票時，每個帳號有幾票？</summary><div style="margin-top:6px">整個投票期間，三大品項各有 3 票，每人最多共 9 票。同一家店限投 1 票。</div></details><details style="border-top:1px solid #d8d8d8;padding:10px 0"><summary style="cursor:pointer;font-weight:600">投票送出後可以修改嗎？</summary><div style="margin-top:6px">不行。投票送出後無法修改或取消，送出前請確認。</div></details><details style="border-top:1px solid #d8d8d8;padding:10px 0"><summary style="cursor:pointer;font-weight:600">參加提名或投票可以抽獎嗎？</summary><div style="margin-top:6px">可以。提名期每成功提名 1 家，可獲得 1 次抽獎機會（最多 5 次，店家通過審查後生效）；投票期完成任一品項投票，可獲得 1 次抽獎機會。詳見「抽獎辦法」。</div></details><details style="border-top:1px solid #d8d8d8;padding:10px 0"><summary style="cursor:pointer;font-weight:600">最終會公布票數和排名嗎？</summary><div style="margin-top:6px">不會。為維持店家和諧並避免商業炒作，對外一律不公布票數與名次。30 家得獎名單依品項分組，組內依「行政縣市順序＋店名筆畫」排列。</div></details><details style="border-top:1px solid #d8d8d8;padding:10px 0"><summary style="cursor:pointer;font-weight:600">忘記密碼怎麼辦？</summary><div style="margin-top:6px">請在登入頁點選「忘記密碼」，系統將寄送重設連結至註冊 Email，連結 1 小時內有效。以 Google 帳號註冊者，請直接使用 Google 登入。</div></details></div><div class="rules"><b style="font-size:18px">資料授權條款</b><b>一、個人資料蒐集、處理及利用告知事項</b>財團法人看見台灣基金會（以下簡稱「本會」）為辦理「看見台灣 尋味指南」（以下簡稱「本活動」），依個人資料保護法第 8 條規定，告知下列事項。當您註冊會員或送出提名、投票，即視為已閱讀、瞭解並同意本告知事項。<div class="lsub"><b>1. 蒐集目的</b><ul style="margin:4px 0 0;padding-left:22px"><li>本活動之執行</li><li>會員身分辨識、聯絡通知</li><li>抽獎、獎項發放、稅務申報</li><li>店家授權聯繫、活動宣傳</li><li>統計分析與服務優化</li></ul><b>2. 蒐集之個人資料類別</b><ul style="margin:4px 0 0;padding-left:22px"><li>會員資料：姓名、Email、聯絡電話、會員帳號資訊。</li><li>活動參與資料：提名店家資料、推薦理由、投票紀錄、IP 位址及系統操作紀錄。</li><li>領獎資料：限中獎者提供。包括身分證字號或護照號碼、身分證件影本、通訊地址；大獎得主另須提供匯款帳戶資料。</li></ul><b>3. 利用期間、地區、對象及方式</b><ol style="margin:4px 0 0;padding-left:22px"><li>期間：自本活動開始之日起，至蒐集目的消失或法令規定保存期限屆滿為止。</li><li>地區：中華民國境內，及本活動海外推廣所涉之地區。</li><li>對象：本會、本活動委外執行單位（活動執行廠商、系統技術服務商）、律師見證單位及稅務主管機關。</li><li>方式：以電子檔案、紙本或其他適當方式處理、利用與傳輸。</li></ol><b>4. 當事人權利</b>您得透過本活動客服信箱（見下方「聯絡我們」），向本會行使下列權利：<ol style="margin:4px 0 0;padding-left:22px"><li>查詢或請求閱覽。</li><li>請求製給複製本。本會得酌收必要成本費用。</li><li>請求補充或更正。</li><li>請求停止蒐集、處理或利用。</li><li>請求刪除。惟活動執行所必需，或依法須保存之資料，本會得於法律允許範圍內拒絕。</li></ol><b>5. 不提供個人資料之影響</b>您得自由選擇是否提供個人資料。如不提供，或提供之資料不完整、不正確，將無法完成註冊、提名或投票，並喪失抽獎及領獎資格。</div><b>二、智慧財產權條款</b><ul style="margin:4px 0 0;padding-left:22px"><li><b style="display:inline">內容原創</b>：提名內容中自行輸入之文字，須為本人原創，不得抄襲他人著作或提供不實資訊。違者，應自負相關法律責任。</li><li><b style="display:inline">無償授權</b>：參加者完成提名，即視為同意無償授權本會，就其提名內容在全球、不限時間、不限載體（包含官網、社群媒體、多語文宣、宣傳影片及新聞稿等）進行重製、編輯、翻譯（中文、英文、日文）及公開傳輸，並得再授權第三人使用。</li><li><b style="display:inline">不另致酬</b>：參加者除依「抽獎辦法」所獲獎項外，不得以任何名義向本會要求報酬、授權金或賠償，本會使用上述內容亦不另行通知或致酬。</li></ul></div>`;
function rulesPage() {
  const tl = [['提名', '11/16 – 12/20'], ['資格審查', '12/21 – 01/03'], ['投票', '01/04 – 01/29'], ['提名期中獎名單', '［待確認］'], ['投票期中獎名單', '［待確認］'], ['精選店家揭曉', '02/25']];
  return `<section class="phead"><h1>活動辦法</h1></section><div class="sec"><h2 class="h2">活動時程</h2><div class="g6">${tl.map(t => `<div class="card" style="padding:16px;text-align:center"><b>${t[0]}</b><div style="font-size:13px">${t[1]}</div></div>`).join('')}</div>
  <div style="display:flex;gap:10px;margin-top:32px;flex-wrap:wrap"><span class="chip">辦法及規則</span><span class="chip">三大品項</span><span class="chip">抽獎辦法</span><span class="chip">抽獎條件 Q&amp;A</span><span class="chip">常見問題</span><span class="chip">資料授權條款</span><span class="chip">聯絡我們</span></div>
  <div class="anno" style="margin-top:8px">原型說明：點擊上方標籤可捲動至對應段落；內文同步自「活動辦法與規章」文件；抽獎條件 Q&amp;A 與常見問題以展開收合呈現</div>
  <div class="stack" style="margin-top:24px">${RULES_HTML}<div class="rules"><b>聯絡我們</b>對活動有任何問題，歡迎來信活動客服信箱，我們將儘速回覆您。<br>客服信箱：${CS_EMAIL ? `<a class="linkb" href="mailto:${CS_EMAIL}?subject=${encodeURIComponent('【看見台灣・尋味指南】活動詢問')}">${CS_EMAIL}</a>` : '<span class="linkb" style="cursor:default">［活動客服信箱，待提供］</span>'}<div class="anno" style="margin-top:8px">原型說明：點擊信箱即開啟 Email 寄信</div></div></div></div>`;
}
function termsPage() {
  return `<section class="phead"><h1>服務條款與隱私權政策</h1></section><div class="sec stack"><div class="rules"><b>服務條款</b>［內容待基金會提供］</div><div class="rules"><b>隱私權政策</b>［內容待基金會提供］</div></div>`;
}
function nomRules() {
  return `<section class="phead"><h1>我要提名</h1><p>推薦前，請詳閱提名規則，以保障您的參加權益。</p></section><div class="sec"><h2 style="text-align:center;font-size:30px;margin:0 0 24px">提名規則</h2>

    [s('送出成功'), s('再推薦一家／查看我的提名（可刪除後重新提名）／分享給朋友')]
  ], '<b>導覽列：</b>活動首頁｜活動辦法｜我要提名。首頁浮動按鈕：我要提名、分享好友。')}
  ${lane('<b>審查期</b>12/21 – 01/03', [[s('首頁（審查中進度＋抽獎公告預告）'), s('活動紀錄頁（查看審核狀態）'), s('點刪除 → 已鎖定提示' + exTag('E15'))]], '<b>導覽列：</b>活動首頁｜活動辦法。進入提名網址 → 提名已截止頁' + exTag('E14'))}
  ${lane('<b>投票期</b>01/04 – 01/29', [
    [s('首頁（公告列：提名抽獎名單）'), s('投票規則說明'), s('店家瀏覽（品項／縣市篩選、搜尋）' + exTag('E19')), s('店家詳情'), d('已登入？' + exTag('E16')), d('該品項尚有票？' + exTag('E17'))],
    [s('投他一票（每家限 1 票）'), s('確認視窗（送出後不可修改）'), s('投票成功（剩餘票數、首次投票獲抽獎資格）' + exTag('E18')), s('繼續瀏覽／投其他品項／分享此店家')]
  ], '<b>導覽列：</b>活動首頁｜活動辦法｜我要投票｜抽獎公告。瀏覽不需登入，投票前才要求登入。')}
  ${lane('<b>計票期</b>01/30 – 02/24', [[s('首頁（計票中進度＋公告列）'), s('抽獎名單公告（提名期＋投票期）')]], '<b>導覽列：</b>活動首頁｜活動辦法｜抽獎公告。進入投票網址 → 投票已截止頁' + exTag('E21'))}
  ${lane('<b>成果期</b>02/25 起', [[s('首頁（頒獎典禮資訊＋榮耀時刻）'), s('精選店家名單（依品項分組，組內縣市＋筆畫）'), s('店家詳情（投票已截止）／看更多（IST 官網）')]], '<b>導覽列：</b>活動首頁｜活動辦法｜年度精選店家｜中獎名單。已下架店家網址 → 404' + exTag('E22'))}
  </div>`;
}
function excView() {
  const groups = [...new Set(EXC.map(e => e.g))];
  return `<div class="doc"><h1>例外情境總表 E01 – E22</h1><div class="lead">每一項都可點「重現」在原型中直接查看。［ ］內為待確認數值。</div>
  <div class="tr thd"><span>編號</span><span>情境</span><span>觸發條件</span><span>系統處理／畫面行為</span><span>對應畫面</span><span></span></div>
  ${groups.map(g => `<div class="grp">${g}</div>${EXC.filter(e => e.g === g).map(e => `<div class="tr"><span class="id">${e.id}</span><span style="font-weight:600">${e.name}</span><span>${e.when}</span><span>${e.how}</span><span>${e.scr}</span><div>${b('重現', 'exc', e.id, 'btn2 btnS')}</div></div>`).join('')}`).join('')}
  <div style="font-size:14px;line-height:1.8;background:#f5f5f5;border-radius:10px;padding:20px 24px;margin-top:24px"><b>共通原則</b><br>1. 所有截止判斷以伺服器時間為準。<br>2. 需要登入才能執行的動作，一律先導向登入，完成後回到原本的頁面。<br>3. 錯誤發生時保留使用者已填寫的內容。<br>4. 錯誤訊息說明發生什麼事與下一步怎麼做，不顯示系統錯誤代碼。<br>5. 中、英、日三語的提示訊息需一併翻譯。</div></div>`;
}

/* ---------- 組裝 ---------- */
function site() {
  const F = { home, rules: rulesPage, terms: termsPage, nomRules, nomForm, nomSuccess, records, voteRules, storeList, storeDetail, lottery, winners, login, register, googleFill, forgot, reset, msg: msgPage };
  const page = (F[S.screen] || msgPage)();
  const floats = S.screen === 'home' ? `<div class="floats">${S.phase === 'nom' ? b('我要<br>提名', 'nomRules', '', 'fl') : ''}${S.phase === 'vote' ? b('我要<br>投票', 'vote', '', 'fl') : ''}${b('分享<br>好友', 'openShare', '', 'fl')}</div>` : '';
  return { html: header() + page + footer(), floats };
}
function render() {
  const route = S.view !== 'proto' ? '' : (S.screen === 'msg' ? (MROUTE[S.msgKey] || '/404') : (ROUTE[S.screen] || '/') + (S.screen === 'storeDetail' ? (S.storeIdx + 1) : ''));
  LAST_ROUTE = route || LAST_ROUTE;
  let inner, floats = '';
  if (S.view === 'flow') inner = flowView();
  else if (S.view === 'exc') inner = excView();
  else { const r = site(); inner = r.html; floats = r.floats; }
  const key = S.view + '|' + S.screen + '|' + S.msgKey;
  const sc = document.querySelector('.scroll');
  const keepTop = sc && key === lastScreenKey ? sc.scrollTop : 0;
  document.getElementById('app').innerHTML = panel() + `<div class="main">
  ${S.device === 'mob' ? '' : `<div class="narrowWarn">桌機版建議以電腦瀏覽器（寬度 1280px 以上）開啟。用手機看請改用${b('手機版', 'device', 'mob', 'linkb')}。</div>`}
  <div class="topbar">${b(S.panel ? '隱藏控制台' : '顯示控制台', 'togglePanel', '', 'tbtn')}
  <span class="sp"></span><button class="fbtab" data-a="feedback">對此畫面提供意見</button></div>
  <div class="stage ${S.device === 'mob' ? 'mstage' : ''}"><div class="browser ${S.device === 'mob' && S.view === 'proto' ? 'phone' : ''}">${S.view === 'proto' ? `<div class="urlbar"><i></i><i></i><i></i><span>[活動網址]${route}</span></div>` : ''}<div class="scroll">${inner}</div>${floats}${S.view === 'proto' || S.modal === 'feedback' ? modal() : ''}</div></div></div>`;
  const ns = document.querySelector('.scroll');
  if (ns) ns.scrollTop = keepTop;
  lastScreenKey = key;
  if (S.modal === 'feedback' && S.fbDraft && !S.fbSent) { const t = document.getElementById('fb-text'), n = document.getElementById('fb-name'); if (t) t.value = S.fbDraft.text; if (n) n.value = S.fbDraft.name; }
  { const n = document.getElementById("fb-name"); if (n) { if (!n.value) { try { n.value = localStorage.getItem("fbName") || ""; } catch (e) {} } n.addEventListener("input", () => { try { localStorage.setItem("fbName", n.value.trim()); } catch (e) {} }); } }
  if (S.fbSent) S.fbDraft = null;
}
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-a]');
  if (!el) return;
  const fn = A[el.dataset.a];
  if (fn) { ev.preventDefault(); fn(el.dataset.v); }
});
if (window.innerWidth < 1100) S.panel = false;
render();
</script>
</body>
</html>
